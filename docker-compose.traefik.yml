name: dana-kaget

networks:
  edge:
    external: true

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    pids_limit: 128
    expose:
      - "4173"
    environment:
      NODE_ENV: production
      PORT: 4173
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      APP_MODE: live
      PUBLIC_ORIGIN: "https://${APP_HOST:?set APP_HOST in .env}"
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:?set the Traefik IP or CIDR in .env}"
      REPORTS_USER: "${REPORTS_USER:-}"
      REPORTS_PASSWORD: "${REPORTS_PASSWORD:-}"
      TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY:?set TURNSTILE_SITE_KEY in .env}"
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:?set TURNSTILE_SECRET_KEY in .env}"
      CLAIM_SECRET: "${CLAIM_SECRET:?set CLAIM_SECRET in .env}"
      DANA_REWARD_LINK: "${DANA_REWARD_LINK:-}"
      KIRIM_EMAIL_DOMAIN: "${KIRIM_EMAIL_DOMAIN:?set KIRIM_EMAIL_DOMAIN in .env}"
      KIRIM_EMAIL_USERNAME: "${KIRIM_EMAIL_USERNAME:?set KIRIM_EMAIL_USERNAME in .env}"
      KIRIM_EMAIL_PASSWORD: "${KIRIM_EMAIL_PASSWORD:?set KIRIM_EMAIL_PASSWORD in .env}"
      EMAIL_FROM: "${EMAIL_FROM:?set EMAIL_FROM in .env}"
      GA4_MEASUREMENT_ID: "${GA4_MEASUREMENT_ID:-}"
      GROVS_API_KEY: "${GROVS_API_KEY:-}"
      GROVS_TEST_ENVIRONMENT: "${GROVS_TEST_ENVIRONMENT:-false}"
      META_PIXEL_ID: "${META_PIXEL_ID:-}"
      META_ACCESS_TOKEN: "${META_ACCESS_TOKEN:-}"
      META_API_VERSION: "${META_API_VERSION:-v26.0}"
      META_TEST_EVENT_CODE: "${META_TEST_EVENT_CODE:-}"
      ANALYTICS_DEBUG: "false"
    volumes:
      - analytics-data:/app/data
    networks:
      - edge
    labels:
      traefik.enable: "true"
      traefik.docker.network: edge
      # The app denies live reports unless operator credentials are configured.
      traefik.http.routers.dana-kaget.rule: "Host(`${APP_HOST:?set APP_HOST in .env}`)"
      traefik.http.routers.dana-kaget.entrypoints: websecure
      traefik.http.routers.dana-kaget.tls: "true"
      traefik.http.routers.dana-kaget.service: dana-kaget
      traefik.http.services.dana-kaget.loadbalancer.server.port: "4173"
      traefik.http.services.dana-kaget.loadbalancer.server.scheme: http
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:4173/healthz')
          .then(response => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  analytics-data:
